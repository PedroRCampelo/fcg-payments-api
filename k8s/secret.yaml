# Dados SENSIVEIS de payments-api: connection string do banco e credenciais do RabbitMQ.
# Os valores abaixo sao os padroes de DESENVOLVIMENTO LOCAL (os mesmos do docker-compose.yml), iguais
# aos dos Secrets postgres-credentials e rabbitmq-credentials do fcg-orchestration. Para outro ambiente,
# troque os tres lugares juntos.
# A chave de assinatura do JWT NAO esta aqui: vem do Secret compartilhado jwt-signing-key, criado
# pelo fcg-orchestration (k8s/create-jwt-secret.sh) e lido tambem pelos outros dois servicos que usam JWT.
apiVersion: v1
kind: Secret
metadata:
  name: payments-api-secret
  namespace: fcg
  labels:
    app.kubernetes.io/name: payments-api
    app.kubernetes.io/part-of: fcg
type: Opaque
stringData:
  ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcg_payments;Username=fcg;Password=fcg_password
  RabbitMq__Username: fcg
  RabbitMq__Password: fcg_password
